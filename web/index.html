<style>
html, body, #canvas { margin:0; padding:0; border:0; }
body { color:#fff; background:#000; overflow:hidden; touch-action:none; }
#canvas { display:block; }
#canvas:focus { outline:none; }

#boot {
	position:fixed; inset:0; background:#000; z-index:10;
	display:flex; flex-direction:column; align-items:center; justify-content:center;
	gap:min(5vh,42px); overflow:hidden;
}
#boot.done { opacity:0; pointer-events:none; transition:opacity .45s ease; }
#stars { position:absolute; inset:0; overflow:hidden; }
#stars i {
	position:absolute; display:block; background:#fff;
	animation:fall linear infinite;
}
@keyframes fall { from { transform:translateY(-10vh); } to { transform:translateY(110vh); } }

#logo { width:min(78vw,620px); position:relative; animation:flicker 4.3s steps(1,end) infinite; }
#logo svg { width:100%; height:auto; display:block; }
@keyframes flicker { 0%,1.4%{opacity:.45} 1.5%,100%{opacity:1} }

#bar {
	width:min(70vw,520px); height:26px; border:4px solid #3ab6ff;
	background:#04070f; padding:4px; position:relative;
}
#fill { height:100%; width:0%; background:#3ab6ff; transition:width .18s linear; }
#bar.indeterminate #fill {
	width:28%; animation:sweep 1.1s ease-in-out infinite alternate; background:#ffd45c;
}
@keyframes sweep { from { margin-left:0 } to { margin-left:72% } }

#pct { width:min(48vw,260px); }
#pct svg, #notice svg { width:100%; height:auto; display:block; }
#notice { width:min(80vw,560px); }
#hint { width:min(40vw,220px); animation:blink 1s steps(1,end) infinite; }
@keyframes blink { 0%,60%{opacity:1} 61%,100%{opacity:0} }
</style>

		s.style.opacity = (0.3 + Math.random() * 0.7).toFixed(2);
		s.style.background = tints[(Math.random() * tints.length) | 0];
		s.style.animationDuration = (3 + Math.random() * 7).toFixed(2) + 's';
		s.style.animationDelay = (-Math.random() * 10).toFixed(2) + 's';
		stars.appendChild(s);
	}

	hint.innerHTML = pixelText('PLEASE WAIT', '#5f708f');
	pct.innerHTML = pixelText('LOADING', '#e6ecff');

	let initializing = true;

	function setProgress(current, total) {
		if (current > 0 && total > 0) {
			bar.classList.remove('indeterminate');
			const p = Math.max(0, Math.min(100, Math.round((current / total) * 100)));
			fill.style.width = p + '%';
			pct.innerHTML = pixelText('LOADING ' + p + '%', '#e6ecff');
		} else {
			bar.classList.add('indeterminate');
			pct.innerHTML = pixelText('LOADING', '#e6ecff');
		}
	}
	setProgress(0, 0);

	function setStatusNotice(text) {
		bar.style.display = 'none';
		pct.style.display = 'none';
		hint.style.display = 'none';
		notice.innerHTML = String(text).split('\n')
			.map(function (line) { return pixelText(line, '#ff4d59'); }).join('');
	}

	function hideBoot() {
		if (!initializing) { return; }
		initializing = false;
		boot.classList.add('done');
		setTimeout(function () { boot.remove(); }, 500);
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		
		engine.startGame({
			'onProgress': setProgress,
		}).then(hideBoot, displayFailureNotice);
	}
}());
</script>
</body>
</html>
